# ancrage (free : n'importe où ; wall : dos à un mur ; eave_wall : dos au mur d'égout, zone
# basse d'un comble), pièce (filtre de la bibliothèque). Cotes, plages et dégagements : projet
# OpenPlan Studio (CC0). Modèles 3D et vignettes : Kenney « Furniture Kit » (CC0 1.0), voir
# assets/furniture/SOURCES.yaml et docs/licenses/README.md. Les onze identifiants d'origine sont
# conservés : les projets existants restent valides.
