[project]
# Nom de distribution (PyPI) : openplan-studio ; le paquet importable reste `openplan`.
name = "openplan-studio"
version = "0.1.0.dev0"
description = "OpenPlan Studio : photos d'intérieur vers plan 2D paramétrique, scène 3D éditable et aménagement assisté. Local-first, open-source."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "OpenPlan Studio contributors" }]
keywords = ["floorplan", "interior-design", "3d", "computer-vision", "blender", "local-first"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# Noyau : ne dépend d'aucun framework, d'aucun modèle IA.
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "shapely>=2.0",
  "trimesh>=4.4",
  "networkx>=3.2",       # requis par trimesh (split, facettes, graphe) ; n'arrivait que via torch (D1, CI)
  "scipy>=1.13",         # requis par trimesh pour l'export GLB
  "mapbox-earcut>=1.0",  # triangulation des polygones extrudés
  "jsonpatch>=1.33",
  "pyyaml>=6.0",
  "reportlab>=4.2",
  "ezdxf>=1.3",
  "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
# Serveur HTTP local (incrément 3). httpx : l'application importe l'adaptateur de modèle
# distant (classe d'erreur) même quand aucun modèle n'est configuré.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "httpx>=0.27"]
# Traitement d'image sans réseau de neurones (incrément 5).
vision = ["opencv-python-headless>=4.10", "pillow>=10.4"]
# Assistant IA par API compatible OpenAI (incrément 7) : seul client HTTP du projet.
ai = ["httpx>=0.27"]
# L'application complète sans les modèles neuronaux : `uv tool install "openplan-studio[app]"`.
app = ["openplan-studio[api,vision,ai,monitoring]"]
# Suivi des erreurs du serveur en ligne (D4, GlitchTip) : actif seulement avec
# OPENPLAN_SENTRY_DSN ; sans elle, sentry_sdk n'est pas importé et rien ne part.
monitoring = ["sentry-sdk>=2.19"]
# Modèles neuronaux locaux (incrément 8) : lourd (torch), installé à part : make setup-neural.
# Les poids ne viennent jamais avec : `openplan models pull <id>` est une action explicite.
neural = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.45",
    "huggingface-hub>=0.24",
    "diffusers>=0.30",
    "accelerate>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "httpx>=0.27",
  "types-PyYAML",
]

[project.scripts]
openplan = "openplan.cli.main:main"
plandesign = "openplan.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# `make build` copie dans openplan/_bundled/ le front construit, le registre des modèles, le
# catalogue et le script Blender (dossier ignoré par git, embarqué dans le wheel). Jamais de poids.
artifacts = ["openplan/_bundled/**"]

[tool.hatch.build.targets.wheel]
packages = ["openplan"]

[tool.hatch.build.targets.sdist]
include = ["openplan", "README.md", "LICENSE", "pyproject.toml"]

# ------------------------------------------------------------------
# Qualité
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "blender", "models", "data", "docs", "openplan/_bundled"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # caractères Unicode « ambigus » : texte français dans les docstrings
  "PLR2004",                     # nombres magiques : trop bruyant en géométrie
  "PLC0415",                     # imports dans les fonctions : voulus dans adapters (torch, cv2 à la demande)
]

[tool.ruff.lint.pylint]
max-args = 10  # signatures à mots-clés (run_blender, commit, detect_and_propose)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openplan"]
exclude = ["openplan/_bundled/"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
# Bibliothèques sans stubs : on les isole plutôt que de désactiver strict globalement.
[[tool.mypy.overrides]]
module = ["shapely.*", "trimesh.*", "jsonpatch", "cv2", "reportlab.*", "pdfplumber.*"]
ignore_missing_imports = true
# Bibliothèques neuronales (extra `neural`) : absentes sur le runner CI et dans l'image Docker
# légère. Sans elles, mypy ne trouve ni les modules ni l'utilité des `type: ignore` qui n'ont de
# sens qu'avec elles. Strict reste actif partout ailleurs ; résultat identique avec ou sans torch.
[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "transformers.*", "diffusers.*", "huggingface_hub.*", "accelerate.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["openplan.adapters.neural.*", "openplan.adapters.registry"]
warn_unused_ignores = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=openplan --cov-report=term-missing"
markers = [
  "blender: nécessite le binaire Blender (ignoré s'il est absent)",
  "slow: test long (modèles, rendu)",
]

[tool.coverage.run]
source = ["openplan"]
branch = true

# ------------------------------------------------------------------
# Frontières d'architecture (voir docs/architecture/00 §4)
# ------------------------------------------------------------------
[tool.importlinter]
root_package = "openplan"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Couches openplan, du haut vers le bas"
type = "layers"
layers = [
  "openplan.cli",
  "openplan.api",
  "openplan.pipeline",
  "openplan.adapters",
  "openplan.validation",
  "openplan.scene",
  "openplan.geom",
  "openplan.schemas",
]

[[tool.importlinter.contracts]]
name = "Noyau pur : schemas et geom sans framework ni modèle"
type = "forbidden"
source_modules = ["openplan.schemas", "openplan.geom"]
forbidden_modules = ["torch", "cv2", "fastapi", "bpy", "open3d", "PIL", "trimesh"]

[[tool.importlinter.contracts]]
name = "Réseau : aucun client HTTP hors de openplan.adapters.remote"
type = "forbidden"
source_modules = [
  "openplan.schemas",
  "openplan.geom",
  "openplan.scene",
  "openplan.validation",
  "openplan.adapters.protocols",
  "openplan.adapters.exif_camera",
  "openplan.adapters.heuristic",
  "openplan.adapters.gateway",
]
forbidden_modules = ["httpx", "requests", "aiohttp", "urllib", "socket", "huggingface_hub"]

[[tool.importlinter.contracts]]
name = "Poids : seul adapters.neural.weights télécharge (huggingface_hub)"
type = "forbidden"
source_modules = [
  "openplan.pipeline",
  "openplan.api",
  "openplan.adapters.neural.depth_anything",
  "openplan.adapters.registry",
  "openplan.adapters.remote",
]
forbidden_modules = ["huggingface_hub"]
