    license: Apache-2.0
    commercial_ok: true
    remote: false
    memory_mb: 0
    device: cpu
    status: implemented
    module: openplan.adapters.heuristic.box_detector
    notes: Arêtes sol-mur par famille de points de fuite et contraste avec la palette du sol. Propose un rectangle, source estimated.

