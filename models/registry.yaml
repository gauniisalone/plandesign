# Registre des modèles, algorithmes et outils disponibles pour les adaptateurs.
# Chaque entrée est documentée dans docs/models/model_registry.md (même identifiant).
# Les poids ne sont jamais commités (voir models/.gitignore) et ne se téléchargent
# qu'à la demande : `openplan models pull <id>` (commande à venir).
#
# status : implemented | optional (outil externe) | planned
# commercial_ok: false => refusé par défaut, opt-in explicite requis.
# remote: true => envoie des données hors de la machine ; jamais sans consentement
#   (privacy.allow_remote_models ET confirmation par projet). Vérifié par un test.

schema_version: 1

models:
  - id: exif_camera@0.1
    role: camera_estimator
    kind: algorithm
    license: Apache-2.0
    commercial_ok: true
    remote: false
    memory_mb: 0
    device: cpu
    status: implemented
    module: openplan.adapters.exif_camera
    notes: Focale depuis l'EXIF (équivalent 35 mm) sinon 0,8 × grand côté ; tangage et roulis supposés nuls.

  - id: vp_camera@0.1
    role: camera_estimator
    kind: algorithm
    license: Apache-2.0
    commercial_ok: true
    remote: false
    memory_mb: 0
    device: cpu
    status: implemented
    module: openplan.adapters.heuristic.camera
    notes: Segments LSD (OpenCV) → points de fuite RANSAC → repère Manhattan ; focale depuis deux points de fuite orthogonaux finis.

  - id: heuristic_box@0.1
    role: room_element_detector
