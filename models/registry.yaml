  - id: depth_anything_v2_metric_indoor_small@1.0
    role: depth_estimator
    kind: weights
    license: Apache-2.0
    commercial_ok: true
    remote: false
    memory_mb: 1200
    weights_mb: 99
    device: cuda|cpu
    status: implemented
    module: openplan.adapters.neural.depth_anything
