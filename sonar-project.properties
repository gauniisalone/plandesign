# KAN-107 : analyse SonarQube Cloud, lancée par la CI (job « sonar » de .github/workflows/ci.yml).
# Le jeton n'est jamais ici : la CI le passe par secrets.SONAR_TOKEN.
sonar.organization=gauniisalone
sonar.projectKey=gauniisalone_plandesign
sonar.projectName=PlanDesign
sonar.sourceEncoding=UTF-8

# Ce qui est analysé (et envoyé) : le code du paquet Python et le code du front, rien d'autre.
# Les tests, les e2e, data/ (photos et mesures privées, ignoré par git), docs/ et apps/site/ sont
# hors de ces dossiers.
sonar.sources=openplan,apps/web/src
# Fichiers générés, migrations et ressources embarquées : ni analysés, ni comptés.
sonar.exclusions=openplan/_bundled/**,openplan/api/accounts/migrations/**,apps/web/src/api/types.gen.ts,**/node_modules/**,**/dist/**,data/**,**/e2e/**,**/e2e-*/**,**/tests/**,**/unit/**

# Couverture : pytest (coverage.xml, chemins relatifs) et l'exécuteur de tests de Node (lcov).
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=apps/web/lcov.info

# Porte qualité non bloquante au départ (KAN-107) : le scanner n'attend pas son verdict.
sonar.qualitygate.wait=false
