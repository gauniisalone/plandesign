# Intégration continue (D1, 15 oct. 2026) : lint, types et tests rapides à chaque push sur main et
# à chaque PR, sans GPU, sans Blender, sans torch et sans e2e (les e2e Playwright restent sur le
# créneau PO ; voir docs/architecture/15-ci-cd-deploiement.md). Jobs parallèles, cible < 4 min.
# Dépôt privé, plan Free : 2 000 min/mois ; artefacts gardés 7 jours. Runner épinglé (ubuntu-latest
# bascule sur Ubuntu 26 le 19 oct. 2026).
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "data/**"]
  pull_request:
    paths-ignore: ["docs/**", "*.md", "data/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (import-linter, ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0   # pas de tag flottant v10 chez setup-uv
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra api --extra vision --extra ai --extra monitoring --extra comptes
      - run: uv run lint-imports
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Sans les tests marqués `slow` (modèles, rendu) ; ceux marqués `blender` s'ignorent d'eux-mêmes
      # quand le binaire est absent.
      - run: uv run pytest -m "not slow"

  web:
    name: web (eslint, tsc, tests unitaires, vite build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  image:
    name: image Docker (construction seule, pas de push)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: openplan-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Taille de l'image dans le résumé du run
        run: |
          docker image inspect openplan-studio:ci --format '{{.Size}}' \
            | awk '{ printf "Image openplan-studio:ci : %.0f Mo\n", $1/1048576 }' | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: wheel + sdist (artefact 7 jours)
    needs: [python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0   # pas de tag flottant v10 chez setup-uv
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: cd apps/web && npm ci --no-audit --no-fund
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
  site:
    name: site public (astro build + check-dist)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: apps/site/dist/
          retention-days: 7
