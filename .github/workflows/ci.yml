# Intégration continue (D1, 15 oct. 2026) : lint, types et tests rapides à chaque push sur main et
# à chaque PR, sans GPU, sans Blender, sans torch. Les e2e Playwright tournent dans e2e.yml, la nuit
# et à la demande, non bloquants (KAN-129 : la phase 2 de KAN-112 est abandonnée) ; voir
# docs/architecture/15-ci-cd-deploiement.md. Jobs parallèles. Le robot de MEP et deploy.yml
# exigent la conclusion « success » du run ci ENTIER : tout job en échec ici, dont « secrets
# (gitleaks) », bloque la MEP (décision du PO, KAN-129).
# KAN-129 : dépôt PRIVÉ, offre gratuite (2 000 minutes par mois) : l'image Docker et la wheel ne se
# construisent que sur main (deploy.yml reconstruit l'image du SHA déployé) ; gitleaks remplace le
# secret scanning de GitHub ; SonarQube Cloud est retiré (103 337 lignes, au-delà des 50 000 de
# l'offre gratuite en privé). Artefacts gardés 7 jours au plus.
# Runner épinglé (ubuntu-latest bascule sur Ubuntu 26 le 19 oct. 2026).
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "data/**"]
  pull_request:
    paths-ignore: ["docs/**", "*.md", "data/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # KAN-112 (5 nov. 2026) : l'ancien job « python » (≈ 15 min, dont pytest ≈ 14,5) est découpé en
  # 2 parts parallèles de pytest (le lint, ≈ 1 min, dans la part 1 : pas de job de plus à
  # facturer), puis le job « python », qui garde son nom (check lu par le robot de MEP et
  # la protection de branche éventuelle) : il fusionne la couverture et ne réussit que si les
  # 2 parts, lint compris, ont réussi.
  pytest:
    name: pytest ${{ matrix.part }}
    runs-on: ubuntu-24.04
    # Une part dure ≈ 8 min (mesure du 5 nov.) ; marge pour la croissance des tests.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Part 1 : liste explicite de dossiers. Part 2 : TOUT le reste de tests/ (--ignore de la
          # part 1), pour qu'un nouveau dossier ou fichier de tests ne soit jamais oublié.
          # Mesure locale du 5 nov. (72b815a, couverture comprise) : integration 191 tests 169 s,
          # accounts 334 tests 231 s, geometry 52 tests 11 s ; unit (≈ 1 050 tests) déduit du
          # pytest de ci (≈ 14,5 min) : ≈ 7 min. Part 1 ≈ 7 min + lint ≈ 1 min, part 2 ≈ 7 min.
          - { part: "1/2 + lint", n: 1, lint: true, args: "tests/unit tests/geometry" }
          - { part: 2/2, n: 2, lint: false, args: "tests --ignore=tests/unit --ignore=tests/geometry" }
    env:
      # Un fichier de données de couverture par part, sans point initial (upload-artifact écarte
      # les fichiers cachés). Chemins relatifs : relative_files = true dans pyproject.toml.
      COVERAGE_FILE: coverage-part${{ matrix.n }}.data
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0   # pas de tag flottant v10 chez setup-uv
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra api --extra vision --extra ai --extra monitoring --extra comptes
      - if: matrix.lint
        run: uv run lint-imports
      - if: matrix.lint
        run: uv run ruff check .
      - if: matrix.lint
        run: uv run ruff format --check .
      - if: matrix.lint
        run: uv run mypy
      # Sans les tests marqués `slow` (modèles, rendu) ; ceux marqués `blender` s'ignorent d'eux-mêmes
      # quand le binaire est absent. Données brutes de couverture seulement : le XML est écrit
      # après fusion, dans le job « python ».
      - run: uv run pytest ${{ matrix.args }} -m "not slow" --cov-report=
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.n }}
          path: coverage-part${{ matrix.n }}.data
          retention-days: 1
          if-no-files-found: error

  python:
    name: python (import-linter, ruff, mypy, pytest)
    needs: [pytest]
    # !cancelled() : si une part échoue, ce job ÉCHOUE (au lieu d'être « skipped », qu'une
    # protection de branche compterait comme réussi) ; un run annulé (cancel-in-progress) ne le
    # lance pas, pour ne pas facturer une minute de plus.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Les 2 parts de pytest (lint compris) ont réussi
        env:
          TESTS: ${{ needs.pytest.result }}
        run: |
          echo "pytest (2 parts, lint compris) : $TESTS"
          [ "$TESTS" = success ]
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0   # pas de tag flottant v10 chez setup-uv
        with:
          enable-cache: true
      - run: uv python install 3.12
      # coverage seul suffit (pytest-cov, groupe dev) : le XML relit les sources de openplan/ du
      # checkout, pas le paquet installé.
      - run: uv sync --only-group dev
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
      # KAN-107 : couverture fusionnée en XML, chemins relatifs (artefact coverage-python, 1 jour ;
      # SonarQube Cloud, qui le lisait, est retiré au KAN-129).
      - run: uv run --no-sync coverage combine coverage-part1.data coverage-part2.data
      - run: uv run --no-sync coverage xml -o coverage.xml
      - name: Couverture dans le résumé du run
        run: |
          total=$(uv run --no-sync coverage report --format=total)
          echo "Couverture python (2 parts fusionnées) : ${total} %" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: coverage.xml
          retention-days: 1

  web:
    name: web (eslint, tsc, tests unitaires, vite build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # KAN-107 : les mêmes tests unitaires, avec la couverture de src/ en lcov (exécuteur de Node).
      - run: npm run test:coverage
      # Node écrit les chemins depuis apps/web ; SonarQube Cloud les lit depuis la racine.
      - run: sed -i 's|^SF:src/|SF:apps/web/src/|' lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: apps/web/lcov.info
          retention-days: 1
      - run: npm run build

  # KAN-129 : secrets dans le code. gitleaks (binaire épinglé, somme vérifiée) sur les commits
  # nouveaux du push ou de la PR ; .gitleaksignore liste les faux constats relus. Le rapport masque
  # les valeurs (--redact) et n'est pas versé en artefact.
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Installer gitleaks 8.30.1
        env:
          V: 8.30.1
          SUM: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SUM}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
      - name: Commits nouveaux sans secret
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          from=${BASE:-$BEFORE}
          # Premier push d'une branche, ou historique réécrit : tout l'historique.
          if [ -z "$from" ] || [ "$from" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            range=""
          else
            range="--log-opts=$from..$HEAD"
          fi
          echo "portée : ${range:-tout l'historique}"
          ./gitleaks git --redact --no-banner $range .

  image:
    name: image Docker (construction seule, pas de push)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: openplan-studio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Taille de l'image dans le résumé du run
        run: |
          docker image inspect openplan-studio:ci --format '{{.Size}}' \
            | awk '{ printf "Image openplan-studio:ci : %.0f Mo\n", $1/1048576 }' | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: wheel + sdist (artefact 7 jours)
    needs: [python, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0   # pas de tag flottant v10 chez setup-uv
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: cd apps/web && npm ci --no-audit --no-fund
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
  site:
    name: site public (astro build + check-dist)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: apps/site/dist/
          retention-days: 7
