<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ajouter à PlanDesign</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="choose.js"></script>
  </head>
  <body>
    <main>
      <h1>Ajouter à PlanDesign</h1>
      <img id="preview" alt="Image à ajouter" hidden />
      <p id="source" class="muted"></p>
      <form id="form" hidden>
        <label for="project">Projet</label>
        <select id="project" required></select>
        <label for="node">Moodboard</label>
        <select id="node" required></select>
        <button id="add" type="submit">Ajouter au Moodboard</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p>
        <button id="settings" type="button" class="link" hidden>
          Réglages de l'extension
        </button>
      </p>
    </main>
  </body>
</html>
